services:
  - type: web
    name: ap-bidiq-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTO_SEED
        value: "1"
      - key: ANTHROPIC_MODEL_STRONG
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_FAST
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ap-bidiq-db
          property: connectionString

databases:
  - name: ap-bidiq-db
    plan: free
    region: singapore
    databaseName: bidiq
    postgresMajorVersion: "16"
