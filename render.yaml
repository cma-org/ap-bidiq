services:
  - type: web
    name: ap-bidiq-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTO_SEED
        value: "1"
      - key: ANTHROPIC_MODEL_STRONG
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MODEL_FAST
        value: claude-haiku-4-5
      # Set in Render dashboard at deploy time (Neon connection string)
      - key: DATABASE_URL
        sync: false
      # Set in Render dashboard at deploy time (Anthropic API key)
      - key: ANTHROPIC_API_KEY
        sync: false
