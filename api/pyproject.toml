[project]
name = "ap-bidiq-api"
version = "0.1.0"
description = "AP-BidIQ API — RFP ingest, bid extraction, validation, evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-docx>=1.1",
    "pypdf>=5.1",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.9",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
